name: X投稿LINE通知

on:
  schedule:
    - cron: "0 22 * * *"   # 朝 07:00 JST（UTC 22:00 前日）
    - cron: "0 3 * * *"    # 昼 12:00 JST（UTC 03:00）
    - cron: "0 12 * * *"   # 夜 21:00 JST（UTC 12:00）
  workflow_dispatch:
    inputs:
      slot:
        description: "スロット (morning / noon / night)"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - noon
          - night

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: スロット判定
        id: slot
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL="${{ github.event.inputs.slot }}"

          if [ "$SCHEDULE" = "0 22 * * *" ]; then
            echo "slot=morning" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "0 3 * * *" ]; then
            echo "slot=noon" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "0 12 * * *" ]; then
            echo "slot=night" >> $GITHUB_OUTPUT
          elif [ -n "$MANUAL" ]; then
            echo "slot=$MANUAL" >> $GITHUB_OUTPUT
          else
            echo "slot=morning" >> $GITHUB_OUTPUT
          fi

      - name: LINE通知送信
        if: false
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          echo "[x-post-notify] slot=$SLOT"

          HTTP_STATUS=$(curl -sf -w "%{http_code}" -o /tmp/response.json \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"slot\":\"$SLOT\",\"secret\":\"${{ secrets.NOTIFY_SECRET }}\"}" \
            "https://bousai-lab.vercel.app/api/notify-x-post")

          cat /tmp/response.json
          echo ""
          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "[ERROR] 送信失敗 (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "[OK] LINE通知送信完了"
