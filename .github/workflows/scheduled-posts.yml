name: scheduled-posts

on:
  schedule:
    # 朝08:00 JST（UTC 23:00 前日）
    - cron: "0 23 * * *"
    # 昼12:00 JST（UTC 03:00）
    - cron: "0 3 * * *"
    # 夜20:00 JST（UTC 11:00）
    - cron: "0 11 * * *"
    # 夜21:00 JST（UTC 12:00）定時災害まとめ
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "スロット"
        required: true
        default: "morning"
        type: choice
        options:
          - morning       # 朝の保存系投稿
          - noon          # 昼のストーリー投稿
          - evening       # 夜のまとめ投稿
          - daily-summary # 定時災害まとめ

jobs:
  post:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: disaster-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled post
        env:
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          X_CONSUMER_KEY:        ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET:     ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)

          echo "[scheduled-posts] SLOT=$SLOT HOUR=$HOUR MINUTE=$MINUTE"

          if [ -n "$SLOT" ]; then
            # workflow_dispatch による手動実行
            case "$SLOT" in
              morning)       python scheduled_post_runner.py morning --auto-post ;;
              noon)          python scheduled_post_runner.py noon ;;
              evening)       python scheduled_post_runner.py evening --auto-post ;;
              daily-summary) python daily_summary.py ;;
            esac
          elif [ "$HOUR" = "23" ] && [ "$MINUTE" -lt "30" ]; then
            # 朝08:00 JST = UTC 23:00（GitHub遅延を考慮して30分ウィンドウ）
            echo "[SLOT] morning"
            python scheduled_post_runner.py morning --auto-post
          elif [ "$HOUR" = "03" ] && [ "$MINUTE" -lt "30" ]; then
            # 昼12:00 JST = UTC 03:00
            echo "[SLOT] noon"
            python scheduled_post_runner.py noon
          elif [ "$HOUR" = "11" ] && [ "$MINUTE" -lt "30" ]; then
            # 夜20:00 JST = UTC 11:00
            echo "[SLOT] evening"
            python scheduled_post_runner.py evening --auto-post
          elif [ "$HOUR" = "12" ] && [ "$MINUTE" -lt "30" ]; then
            # 夜21:00 JST = UTC 12:00
            echo "[SLOT] daily-summary"
            python daily_summary.py
          else
            echo "[SKIP] スケジュール遅延が30分超のため今回はスキップ (HOUR=$HOUR MINUTE=$MINUTE)"
          fi
