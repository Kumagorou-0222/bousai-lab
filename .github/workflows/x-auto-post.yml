name: X自動投稿（朝昼夜）

on:
  schedule:
    - cron: "0 22 * * *"   # 朝 07:00 JST  (UTC 22:00 前日)
    - cron: "0 3 * * *"    # 昼 12:00 JST  (UTC 03:00)
    - cron: "*/15 9-12 * * *" # 夜 18:00 JST 開始、21:45 JST まで15分ごとに再試行
    - cron: "55 12 * * *"    # 夜の最終再試行 21:55 JST
  workflow_dispatch:
    inputs:
      slot:
        description: "スロット指定"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - noon
          - night

permissions:
  contents: write   # 履歴ファイルを commit/push するために必要

concurrency:
  group: x-auto-post-main
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      # ── 1. チェックアウト
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Node.js 20 セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # ── 3. 依存関係インストール
      - name: npm install
        run: npm ci

      # ── 4. スロット判定
      - name: スロット判定
        id: slot
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL="${{ github.event.inputs.slot }}"

          if   [ "$SCHEDULE" = "0 22 * * *" ]; then echo "slot=morning" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 3 * * *"  ]; then echo "slot=noon"    >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "*/15 9-12 * * *" ] || [ "$SCHEDULE" = "55 12 * * *" ]; then echo "slot=night" >> "$GITHUB_OUTPUT"
          elif [ -n "$MANUAL" ];               then echo "slot=$MANUAL"  >> "$GITHUB_OUTPUT"
          else                                      echo "slot=morning"  >> "$GITHUB_OUTPUT"
          fi

      # ── 5. X 投稿
      - name: X 投稿実行
        id: post
        if: steps.slot.outputs.slot != 'night'
        continue-on-error: true
        env:
          POST_SLOT:            ${{ steps.slot.outputs.slot }}
          X_API_KEY:            ${{ secrets.X_API_KEY }}
          X_API_SECRET:         ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:      ${{ secrets.X_ACCESS_SECRET }}
        run: npx tsx scripts/postToX.ts

      - name: 夜枠の投稿予約
        id: night_prepare
        if: steps.slot.outputs.slot == 'night'
        continue-on-error: true
        env:
          X_API_KEY:       ${{ secrets.X_API_KEY }}
          X_API_SECRET:    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npx tsx scripts/postNightToX.ts prepare

      - name: 夜枠の投稿予約を確定
        if: steps.night_prepare.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/x-post-history.json
          git commit -m "chore: 夜枠の投稿予約 [skip ci]"
          git push

      - name: 夜枠のレビュー済み新作投稿
        id: night_post
        if: steps.night_prepare.outputs.ready == 'true'
        continue-on-error: true
        env:
          X_API_KEY:       ${{ secrets.X_API_KEY }}
          X_API_SECRET:    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npx tsx scripts/postNightToX.ts send

      # ── 6. X API失敗時は手動投稿用のLINE通知へフォールバック
      - name: X投稿失敗時のLINEフォールバック通知
        if: steps.post.outcome == 'failure'
        env:
          POST_SLOT:     ${{ steps.slot.outputs.slot }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          echo "[x-auto-post] X API投稿に失敗したため、LINE通知へフォールバックします slot=$POST_SLOT"

          HTTP_STATUS=$(curl -sS -w "%{http_code}" -o /tmp/response.json \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"slot\":\"$POST_SLOT\",\"secret\":\"$NOTIFY_SECRET\"}" \
            "https://bousai-lab.vercel.app/api/notify-x-post")

          cat /tmp/response.json
          echo ""
          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "[ERROR] LINEフォールバック通知に失敗しました (HTTP $HTTP_STATUS)"
            exit 1
          fi

      # ── 7. 履歴ファイルをコミット
      - name: 投稿履歴をコミット
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/x-post-history.json
          # 変更がある場合のみコミット
          git diff --cached --quiet || git commit -m "chore: X投稿ログ更新 ${{ steps.slot.outputs.slot }} [skip ci]"
          git push

      # ── 8. 自動投稿に失敗したことはActions上でも失敗として残す
      - name: X投稿失敗を反映
        if: steps.post.outcome == 'failure' || steps.night_prepare.outcome == 'failure' || steps.night_post.outcome == 'failure'
        run: exit 1
