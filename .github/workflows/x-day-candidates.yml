name: X朝昼候補台帳を更新

on:
  push:
    branches: [main]
    paths:
      - 'content/articles/**'
      - 'public/manga/**'
      - 'lib/articles.ts'
      - 'lib/xPostQueue.ts'
      - 'lib/xHashtags.ts'
      - 'scripts/buildXDayCandidates.ts'
      - '.github/workflows/x-day-candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-day-candidates-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/buildXDayCandidates.ts
      - name: 変更があれば候補台帳を保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/x-day-candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: 朝昼X候補を更新 [skip ci]'
          git push origin HEAD:main

