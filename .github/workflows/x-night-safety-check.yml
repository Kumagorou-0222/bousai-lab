name: X夜枠の安全性テスト

on:
  pull_request:
    paths:
      - '.github/workflows/x-auto-post.yml'
      - '.github/workflows/x-night-safety-check.yml'
      - 'lib/xNightPost.ts'
      - 'scripts/postNightToX.ts'
      - 'tests/xNightPost.test.mjs'
      - 'data/x-night-approved.json'
      - 'public/manga/daily/**'
      - 'scripts/check-native-comic-resolution.mjs'
      - 'docs/daily_native_resolution/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: node --test tests/xNightPost.test.mjs
      - name: 個別実生成版の解像度・非拡大ゲート
        run: |
          for manifest in docs/daily_native_resolution/*-manifest.json; do
            slot=$(basename "$manifest" -manifest.json)
            node scripts/check-native-comic-resolution.mjs "$slot"
          done
