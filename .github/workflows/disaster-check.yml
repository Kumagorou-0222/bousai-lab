name: disaster-check

on:
  schedule:
    # 5分ごとに実行（UTC）
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: false
        default: "normal"
        type: choice
        options:
          - normal        # 通常実行
          - test-telegram # Telegramにテスト送信
          - test-keywords # キーワードマッチングのテスト（全角/半角）
          - debug-feed    # フィード内容を表示（通知なし）
          - reset-db      # seen_entries.db をリセットして通常実行

jobs:
  run:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: disaster-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # seen_entries.db をキャッシュして重複通知を防ぐ
      - name: Cache seen_entries DB
        uses: actions/cache@v4
        with:
          path: disaster-bot/seen_entries.db
          key: seen-entries-db-${{ github.run_id }}
          restore-keys: |
            seen-entries-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          echo "[DEBUG] MODE=$MODE"

          if [ "$MODE" = "test-telegram" ]; then
            python debug_feed.py --test-telegram
          elif [ "$MODE" = "test-keywords" ]; then
            python debug_feed.py --test-keywords
          elif [ "$MODE" = "debug-feed" ]; then
            python debug_feed.py
          elif [ "$MODE" = "reset-db" ]; then
            python debug_feed.py --reset-db
            python main.py
          else
            python main.py
          fi
