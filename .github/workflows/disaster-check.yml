name: disaster-check

on:
  schedule:
    # 5分ごとに実行（UTC）- 時刻ベースルーティングで朝・昼・夜を判定
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: false
        default: "normal"
        type: choice
        options:
          - normal        # 通常実行
          - test-telegram # Telegramにテスト送信
          - test-keywords # キーワードマッチングのテスト（全角/半角）
          - debug-feed    # フィード内容を表示（通知なし）
          - reset-db      # seen_entries.db をリセットして通常実行
          - daily-summary # 定時災害まとめを手動送信
          - morning       # 朝の保存系投稿案を手動送信
          - noon          # 昼のストーリー投稿案を手動送信
          - evening       # 夜のまとめ投稿案を手動送信

jobs:
  run:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: disaster-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # seen_entries.db をキャッシュして重複通知を防ぐ
      - name: Cache seen_entries DB
        uses: actions/cache@v4
        with:
          path: disaster-bot/seen_entries.db
          key: seen-entries-db-${{ github.run_id }}
          restore-keys: |
            seen-entries-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL:       ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_CONSUMER_KEY:            ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET:         ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:            ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:     ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          AUTO_POST_ENABLED:         ${{ secrets.AUTO_POST_ENABLED }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)

          echo "[DEBUG] MODE=$MODE HOUR=$HOUR MINUTE=$MINUTE"

          if [ "$MODE" = "test-telegram" ]; then
            python debug_feed.py --test-telegram
          elif [ "$MODE" = "test-keywords" ]; then
            python debug_feed.py --test-keywords
          elif [ "$MODE" = "debug-feed" ]; then
            python debug_feed.py
          elif [ "$MODE" = "reset-db" ]; then
            python debug_feed.py --reset-db
            python main.py
          elif [ "$MODE" = "daily-summary" ]; then
            python daily_summary.py
          elif [ "$MODE" = "morning" ]; then
            python scheduled_post_runner.py morning --auto-post
          elif [ "$MODE" = "noon" ]; then
            python scheduled_post_runner.py noon
          elif [ "$MODE" = "evening" ]; then
            python scheduled_post_runner.py evening --auto-post
          elif [ "$HOUR" = "23" ] && [ "$MINUTE" -lt "5" ]; then
            # 朝08:00 JST = UTC 23:00
            echo "[SLOT] morning"
            python scheduled_post_runner.py morning --auto-post
          elif [ "$HOUR" = "03" ] && [ "$MINUTE" -lt "5" ]; then
            # 昼12:00 JST = UTC 03:00
            echo "[SLOT] noon"
            python scheduled_post_runner.py noon
          elif [ "$HOUR" = "11" ] && [ "$MINUTE" -lt "5" ]; then
            # 夜20:00 JST = UTC 11:00
            echo "[SLOT] evening"
            python scheduled_post_runner.py evening --auto-post
          elif [ "$HOUR" = "12" ] && [ "$MINUTE" -lt "5" ]; then
            # 夜21:00 JST = UTC 12:00 定時災害まとめ
            echo "[SLOT] daily-summary"
            python daily_summary.py
          else
            python main.py
          fi
