name: 毎日の記事ストック自動生成

on:
  schedule:
    - cron: "30 20 * * *"   # 毎日 05:30 JST (UTC 20:30 前日)
  workflow_dispatch:
    inputs:
      count:
        description: "生成する記事数"
        required: false
        default: "1"

permissions:
  contents: write   # 下書きを commit/push するために必要

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: npm install
        run: npm ci

      # ── 1. アイデアが少なくなったら自動補充
      - name: 記事アイデア補充
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/replenishIdeas.ts --min 5 --add 10

      # ── 2. 記事下書きを生成（デフォルト1本/日）
      - name: 記事下書き生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/generateArticleDraft.ts --limit ${{ github.event.inputs.count || '1' }}

      # ── 3. 品質チェック（warningのみ・失敗させない）
      - name: 下書きバリデーション
        run: npx tsx scripts/validateDraft.ts

      # ── 4. 4コマ漫画用プロンプトを生成（画像はローカルでChatGPT生成）
      - name: 漫画プロンプト生成
        run: npx tsx scripts/buildMangaPrompt.ts

      # ── 5. コミット & プッシュ
      - name: コミット & プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/article-ideas.json content/drafts/
          if git diff --cached --quiet; then
            echo "変更なし — コミットをスキップ"
          else
            git commit -m "chore: 記事下書き自動生成 $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
