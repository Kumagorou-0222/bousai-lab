<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="50%" style="stop-color:#FF9500"/>
      <stop offset="100%" style="stop-color:#FFD000"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 白い丸（装飾） -->
  <circle cx="1100" cy="80" r="200" fill="rgba(255,255,255,0.08)"/>
  <circle cx="100" cy="550" r="150" fill="rgba(255,255,255,0.06)"/>

  <!-- 白いカード -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="rgba(255,255,255,0.15)" filter="url(#shadow)"/>

  <!-- 家のアイコン（シンプルSVG） -->
  <g transform="translate(540, 130)">
    <!-- 屋根 -->
    <polygon points="-80,-40 0,-110 80,-40" fill="white" opacity="0.95"/>
    <!-- 壁 -->
    <rect x="-60" y="-40" width="120" height="80" rx="4" fill="white" opacity="0.95"/>
    <!-- ドア -->
    <rect x="-18" y="8" width="36" height="32" rx="4" fill="#FF6B00"/>
    <!-- 窓 -->
    <rect x="-50" y="-25" width="25" height="22" rx="3" fill="#FFD000"/>
    <rect x="25" y="-25" width="25" height="22" rx="3" fill="#FFD000"/>
  </g>

  <!-- サイト名 -->
  <text x="600" y="300" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif" font-size="72" font-weight="900" fill="white" filter="url(#shadow)">在宅避難ラボ</text>

  <!-- サブタイトル -->
  <text x="600" y="370" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif" font-size="34" font-weight="700" fill="rgba(255,255,255,0.92)">武蔵野市の防災・避難所・防災グッズ情報</text>

  <!-- キャッチコピー -->
  <rect x="280" y="408" width="640" height="52" rx="26" fill="rgba(255,255,255,0.25)"/>
  <text x="600" y="442" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif" font-size="26" font-weight="700" fill="white">🏠 おうちを最強の避難場所にしよう！</text>

  <!-- URL -->
  <text x="600" y="530" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="rgba(255,255,255,0.7)">bousai-lab.vercel.app</text>
</svg>
